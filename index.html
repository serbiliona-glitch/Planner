<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#F2F1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15141F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* ---------- Кольори (світла / темна тема) ---------- */
:root{
  --bg:#F2F1F7; --surface:#FFFFFF; --surface2:#ECEBF3; --ink:#1D1B2E; --muted:#6E6B85; --line:#E1DFEB;
  --accent:#5A4FCF; --accent-ink:#FFFFFF; --accent-soft:#E7E4FB;
  --done:#2E9B67; --miss:#D24B5E; --moved:#B7800D; --skip:#8C8AA0;
  --p-high:#E0474C; --p-mid:#E6A817; --p-low:#B3B1C4;
  --shadow:0 1px 2px rgba(29,27,46,.05);
  --tabbar-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --font-round:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15141F; --surface:#201F2D; --surface2:#2A2939; --ink:#EEEDF5; --muted:#A09DB8; --line:#312F43;
    --accent:#9187FF; --accent-ink:#15141F; --accent-soft:#2D2A4D;
    --done:#4FC98C; --miss:#FF6E82; --moved:#E8B447; --skip:#8C8AA0;
    --p-high:#FF6B6F; --p-mid:#F2BE3C; --p-low:#5F5C75;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15141F; --surface:#201F2D; --surface2:#2A2939; --ink:#EEEDF5; --muted:#A09DB8; --line:#312F43;
  --accent:#9187FF; --accent-ink:#15141F; --accent-soft:#2D2A4D;
  --done:#4FC98C; --miss:#FF6E82; --moved:#E8B447; --skip:#8C8AA0;
  --p-high:#FF6B6F; --p-mid:#F2BE3C; --p-low:#5F5C75;
  --shadow:none; color-scheme:dark;
}

/* ---------- База ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 28px)}
.loading{color:var(--muted);text-align:center;margin-top:30vh}

/* ---------- Нижнє меню ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);min-height:48px;justify-content:center}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar span{font-size:10.5px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar .plus{justify-self:center;width:50px;height:50px;min-height:0;border-radius:17px;background:var(--accent);color:var(--accent-ink)}
.tabbar .plus svg{width:26px;height:26px;stroke-width:2.4}

/* ---------- Заголовки ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 4px}
.title{font-family:var(--font-round);font-weight:700;font-size:32px;line-height:1.1;margin:0;letter-spacing:-.01em}
.subtitle{color:var(--muted);font-size:15px;margin:4px 0 0;font-weight:500}
.nav-btns{display:flex;gap:6px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:20px;color:var(--ink);box-shadow:var(--shadow)}
.pill-btn{height:40px;border-radius:12px;background:var(--surface);padding:0 12px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:var(--shadow)}

.progress{margin:16px 0 6px}
.progress .nums{display:flex;gap:14px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.progress .nums .ok{color:var(--done)} .progress .nums .no{color:var(--miss)} .progress .nums .mv{color:var(--moved)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar span{height:100%}

.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted);margin:24px 2px 8px}
.sec .cnt{font-weight:600;opacity:.8}
.sec .sp{flex:1}
.sec .add{color:var(--accent);font-size:14px;font-weight:600;padding:4px 2px}

/* ---------- Рядок справи ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:16px;padding:8px 8px 8px 10px;box-shadow:var(--shadow);min-height:60px}
.row .pdot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 2px 0 0}
.pdot.high{background:var(--p-high)} .pdot.mid{background:var(--p-mid)} .pdot.low{background:var(--p-low)}
.row .body{flex:1;min-width:0;text-align:left;padding:4px 4px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.row .t{font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.row .m .s-miss{color:var(--miss);font-weight:600}
.row .m .s-moved{color:var(--moved);font-weight:600}
.row .m .s-skip{color:var(--skip);font-weight:600}
.row .m .s-done{color:var(--done);font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.moved,.row.skipped{opacity:.72}
.row.moved .t,.row.skipped .t{color:var(--muted)}

.acts{display:flex;gap:4px;flex:none}
.act{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--muted);background:var(--surface2)}
.act.done.on{background:var(--done);color:#fff}
.act.miss.on{background:var(--miss);color:#fff}
.act.move{color:var(--moved)}
.act.txt{width:auto;padding:0 12px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft)}

.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.chk.on{background:var(--done);border-color:var(--done)}

.empty{color:var(--muted);text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:16px;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.link{color:var(--accent);font-weight:600;font-size:15px;padding:8px 2px}

/* ---------- Тиждень ---------- */
.day-block{background:var(--surface);border-radius:18px;padding:12px 12px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.day-block.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-h b{font-family:var(--font-round);font-size:17px}
.day-h .d{color:var(--muted);font-size:14px;font-weight:600}
.day-h .sp{flex:1}
.day-h .plus-s{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:600;display:grid;place-items:center}
.day-block .row{box-shadow:none;background:var(--surface2);min-height:54px}
.day-block .row .act:not(.on):not(.txt){background:var(--surface)}
.day-block .none{font-size:14px;color:var(--muted);padding:2px 2px 2px}

.quick{display:flex;gap:8px;margin:8px 0}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.quick button{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:0 16px;font-weight:700;font-size:15px}

/* ---------- Календар ---------- */
.cal{background:var(--surface);border-radius:20px;padding:10px 8px 8px;margin-top:14px;box-shadow:var(--shadow)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0 6px}
.cal-d{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-size:16px;font-weight:600}
.cal-d.out{color:var(--muted);opacity:.45}
.cal-d.today .n{color:var(--accent);font-weight:800}
.cal-d.sel{background:var(--accent)} .cal-d.sel .n{color:var(--accent-ink)}
.cal-d .dots{display:flex;gap:3px;height:6px}
.cal-d .dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots .o{background:#3B82F6} .dots .ok{background:var(--done)} .dots .no{background:var(--miss)}
.cal-d.sel .dots i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin:10px 0 0;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}

/* ---------- Плани ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 4px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 14px;background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:var(--ink);color:var(--bg)}
details.fold{margin-top:18px}
details.fold summary{color:var(--muted);font-weight:700;font-size:14px;padding:6px 2px;list-style:none}
details.fold summary::before{content:"▸ "}
details.fold[open] summary::before{content:"▾ "}

/* ---------- Ще ---------- */
.card{background:var(--surface);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 4px}
.card p{color:var(--muted);font-size:14px;margin:0 0 12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Нижні вікна ---------- */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(12,10,24,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--font-round);font-size:22px;margin:0 0 16px}
.fld{display:block;margin-bottom:16px}
.fld>span,.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font-size:16px;min-height:46px;-webkit-appearance:none;appearance:none}
.fld textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-radius:999px;padding:9px 13px;background:var(--surface2);font-size:14.5px;font-weight:600;min-height:40px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg.full button{border-radius:10px;background:none}
.seg.full button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border-radius:14px;padding:14px;font-weight:700;font-size:16px;min-height:50px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{flex:none;color:var(--miss);padding:14px 8px}
.btn.small{flex:none;min-height:42px;padding:10px 14px;font-size:15px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface2);border-radius:14px;padding:14px;font-size:16.5px;font-weight:600;min-height:56px}
.menu button .e{font-size:22px;width:28px;text-align:center}
.menu button small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.hist{border-top:1px solid var(--line);margin:4px 0 16px;padding-top:12px}
.hist ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:none}
.this-day{background:var(--surface2);border-radius:14px;padding:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:40;max-width:90%;text-align:center}

</style>
</head>
<body>
<main id="main" class="main"><p class="loading">Завантаження…</p></main>

<nav class="tabbar" id="tabbar" aria-label="Розділи">
  <button data-nav="today" aria-label="Сьогодні">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    <span>Сьогодні</span></button>
  <button data-nav="week" aria-label="Тиждень">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M15 4v16"/></svg>
    <span>Тиждень</span></button>
  <button data-nav="calendar" aria-label="Календар">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r=".6"/><circle cx="12" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/><circle cx="8" cy="17.3" r=".6"/><circle cx="12" cy="17.3" r=".6"/></svg>
    <span>Календар</span></button>
  <button class="plus" data-plus aria-label="Додати">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-nav="plans" aria-label="Плани">
    <svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><rect x="3.5" y="5" width="3" height="3" rx="1"/><rect x="3.5" y="10.5" width="3" height="3" rx="1"/><rect x="3.5" y="16" width="3" height="3" rx="1"/></svg>
    <span>Плани</span></button>
  <button data-nav="more" aria-label="Ще">
    <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg>
    <span>Ще</span></button>
</nav>

<div id="sheet"></div>

      return;
    }
    const pc = el.closest("[data-pc]");
    if (pc) {
      state.planCat = pc.dataset.pc;
      render();
      return;
    }
    const th = el.closest("[data-theme-set]");
    if (th) {
      localStorage.setItem("planer-theme", th.dataset.themeSet);
      applyTheme();
      render();
      return;
    }
    if (el.closest("[data-export]")) {
      doExport();
      return;
    }
    if (el.closest("[data-import]")) {
      document.getElementById("import-file").click();
      return;
    }
  });
  document.addEventListener("submit", async (e) => {
    const form = e.target.closest("[data-quick]");
    if (!form) return;
    e.preventDefault();
    const title = form.q.value.trim();
    if (!title) return;
    const t = newTask({ title });
    if (form.dataset.quick === "week") t.weekOf = state.week;
    if (form.dataset.quick === "plan" && state.planCat !== "all") t.category = state.planCat;
    await safe(saveTask(t));
    const input = main.querySelector("[data-quick] input");
    if (input) input.focus();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSheet();
  });
  async function doExport() {
    const name = `planer-${today()}.json`;
    const file = new File([JSON.stringify(exportData(), null, 1)], name, { type: "application/json" });
    const mark = () => {
      localStorage.setItem("planer-last-backup", (/* @__PURE__ */ new Date()).toISOString());
      render();
    };
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "\u0420\u0435\u0437\u0435\u0440\u0432\u043D\u0430 \u043A\u043E\u043F\u0456\u044F \u043F\u043B\u0430\u043D\u0435\u0440\u0430" });
        mark();
        return;
      } catch (err) {
        if (err.name === "AbortError") return;
      }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5e3);
    mark();
  }
  document.addEventListener("change", async (e) => {
    if (e.target.id !== "import-file") return;
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      const obj = JSON.parse(await f.text());
      if (!obj || obj.app !== "planer" || !Array.isArray(obj.tasks)) throw new Error();
      const ok = confirm(`\u0417\u0430\u043C\u0456\u043D\u0438\u0442\u0438 \u0432\u0441\u0456 \u043F\u043E\u0442\u043E\u0447\u043D\u0456 \u0434\u0430\u043D\u0456 (${data.tasks.size} \u0441\u043F\u0440\u0430\u0432) \u0434\u0430\u043D\u0438\u043C\u0438 \u0437 \u0444\u0430\u0439\u043B\u0443 (${obj.tasks.length} \u0441\u043F\u0440\u0430\u0432)?

\u041F\u043E\u0442\u043E\u0447\u043D\u0456 \u0434\u0430\u043D\u0456 \u0431\u0443\u0434\u0435 \u0432\u0438\u0434\u0430\u043B\u0435\u043D\u043E. \u042F\u043A\u0449\u043E \u0432\u043E\u043D\u0438 \u043F\u043E\u0442\u0440\u0456\u0431\u043D\u0456, \u0441\u043F\u0435\u0440\u0448\u0443 \u0437\u0440\u043E\u0431\u0438 \u0435\u043A\u0441\u043F\u043E\u0440\u0442.`);
      if (!ok) return;
      await importData(obj);
      toast("\u0414\u0430\u043D\u0456 \u0432\u0456\u0434\u043D\u043E\u0432\u043B\u0435\u043D\u043E");
    } catch (err) {
      toast("\u0426\u0435\u0439 \u0444\u0430\u0439\u043B \u043D\u0435 \u0441\u0445\u043E\u0436\u0438\u0439 \u043D\u0430 \u0440\u0435\u0437\u0435\u0440\u0432\u043D\u0443 \u043A\u043E\u043F\u0456\u044E \u043F\u043B\u0430\u043D\u0435\u0440\u0430");
    }
  });
})();

</script>
