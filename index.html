<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#F4ECE2" id="theme-color">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* ---------- Кольорові гами (обирається в «Ще») ---------- */
:root{
  /* Теплий беж */
  --bg:#F4ECE2; --on-bg:#3A2A22; --on-bg-muted:#85705F; --bg-line:#E2D5C5;
  --surface:#FFFBF6; --surface2:#F5EDE3; --ink:#3A2A22; --muted:#85705F; --line:#E8DCCD;
  --accent:#C2603D; --accent-ink:#FFFFFF; --accent-soft:#F6E2D8;
  --done:#5E8A52; --miss:#C8454E; --moved:#B47A1A; --skip:#9A8B7E;
  --p-high:#D9473F; --p-mid:#E0A21E; --p-low:#C9BBAE;
  --c-doctor:#3D8A9A; --c-jesya:#C25588; --c-shop:#C98A2B; --c-hobby:#5E8A52; --c-home:#8A6BB0; --c-work:#4F72B8; --c-other:#8C8478; --c-health:#3E9B78; --c-growth:#C0703A;
  --shadow:0 2px 10px rgba(80,50,30,.07);
  --tabbar-h:64px;
  --font:"Nunito",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --font-round:"Comfortaa",ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-palette="lavender"]{
  --bg:#EEE9F7; --on-bg:#2D2140; --on-bg-muted:#776A8C; --bg-line:#DCD3EC;
  --surface:#FFFFFF; --surface2:#F3EFFA; --ink:#2D2140; --muted:#776A8C; --line:#E4DCF0;
  --accent:#7A4B9C; --accent-ink:#FFFFFF; --accent-soft:#EBE0F4;
  --done:#3F9C7E; --miss:#C9466B; --moved:#B57F1A; --skip:#8E86A3;
  --p-high:#D9475F; --p-mid:#E2A72A; --p-low:#C5BCD6;
  --shadow:0 2px 10px rgba(60,30,90,.08);
}
:root[data-palette="mint"]{
  --bg:#E4F2EE; --on-bg:#16303A; --on-bg-muted:#5C7A80; --bg-line:#CCE3DC;
  --surface:#FFFFFF; --surface2:#EEF7F4; --ink:#16303A; --muted:#5C7A80; --line:#D3E7E1;
  --accent:#1F7A75; --accent-ink:#FFFFFF; --accent-soft:#D5ECE8;
  --done:#3B9358; --miss:#C94552; --moved:#B07A18; --skip:#82999C;
  --p-high:#D6474B; --p-mid:#E0A325; --p-low:#B8CCC8;
  --shadow:0 2px 10px rgba(20,60,60,.07);
}
:root[data-palette="forest"]{
  --bg:#1F3A2E; --on-bg:#F3EEDF; --on-bg-muted:#B4C2AE; --bg-line:#355443;
  --surface:#F6F1E3; --surface2:#ECE5D2; --ink:#22301F; --muted:#6B705C; --line:#E0D8C1;
  --accent:#2E6248; --accent-ink:#F6F1E3; --accent-soft:#F1E2BD;
  --done:#5F8A3A; --miss:#B8483F; --moved:#A7741A; --skip:#7D806C;
  --p-high:#C9463E; --p-mid:#D9A53A; --p-low:#BDB59C;
  --shadow:0 2px 12px rgba(0,0,0,.18);
}

/* ---------- База ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--on-bg);transition:background .25s;font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 28px)}
.loading{color:var(--on-bg-muted);text-align:center;margin-top:30vh}

/* ---------- Нижнє меню ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar{color:var(--ink)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);min-height:48px;justify-content:center}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar span{font-size:10.5px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar .plus{justify-self:center;width:50px;height:50px;min-height:0;border-radius:18px;background:var(--accent);color:var(--accent-ink)}
.tabbar .plus svg{width:26px;height:26px;stroke-width:2.4}

/* ---------- Заголовки ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 4px}
.title{font-family:var(--font-round);font-weight:700;font-size:32px;line-height:1.1;margin:0;letter-spacing:-.01em}
.subtitle{color:var(--on-bg-muted);font-size:15px;margin:4px 0 0;font-weight:500}
.nav-btns{display:flex;gap:6px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:20px;color:var(--ink);box-shadow:var(--shadow)}
.pill-btn{height:40px;border-radius:14px;background:var(--surface);padding:0 12px;font-size:14px;font-weight:600;color:var(--accent);box-shadow:var(--shadow)}

.progress{margin:16px 0 6px}
.progress .nums{display:flex;gap:14px;font-size:14px;font-weight:700;color:var(--on-bg-muted);margin-bottom:8px}
.progress .nums .ok,.progress .nums .no,.progress .nums .mv{color:var(--on-bg)}
.bar{height:8px;border-radius:8px;background:var(--bg-line);overflow:hidden;display:flex}
.bar span{height:100%}

.sec{display:flex;align-items:center;gap:8px;font-family:var(--font-round);font-size:14px;font-weight:700;color:var(--on-bg-muted);margin:24px 2px 8px}
.sec .cnt{font-weight:600;opacity:.8}
.sec .sp{flex:1}
.sec .add{color:var(--on-bg);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:600;padding:4px 2px}

/* ---------- Рядок справи ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{--cc:var(--c-other);display:flex;align-items:center;gap:6px;color:var(--ink);background:color-mix(in srgb,var(--cc) 11%,var(--surface));border-radius:20px;padding:8px 8px 8px 10px;box-shadow:var(--shadow);min-height:60px}
.row .pdot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 2px 0 0}
.pdot.high{background:var(--p-high)} .pdot.mid{background:var(--p-mid)} .pdot.low{background:var(--p-low)}
.row .body{flex:1;min-width:0;text-align:left;padding:4px 4px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.row .t{font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.row .m .s-miss{color:var(--miss);font-weight:600}
.row .m .s-moved{color:var(--moved);font-weight:600}
.row .m .s-skip{color:var(--skip);font-weight:600}
.row .m .s-done{color:var(--done);font-weight:600}
.row .m .s-closed{color:var(--done);font-weight:800}
.row .m .s-fire{color:var(--accent);font-weight:800}
.row .m .cat{color:var(--cc);font-weight:700}
.row.done{background:var(--surface)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.moved,.row.skipped{opacity:.72}
.row.moved .t,.row.skipped .t{color:var(--muted)}

.acts{display:flex;gap:4px;flex:none}
.act{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:17px;font-weight:700;color:var(--muted);background:var(--surface)}
.act.done.on{background:var(--done);color:#fff}
.act.miss.on{background:var(--miss);color:#fff}
.act.move{color:var(--moved)}
.act.txt{width:auto;padding:0 12px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft)}

.chk{width:30px;height:30px;border-radius:11px;border:2px solid color-mix(in srgb,var(--cc) 45%,var(--line));background:var(--surface);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.chk.on{background:var(--done);border-color:var(--done)}

.empty{color:var(--on-bg-muted);text-align:center;padding:26px 14px;border:2px dashed var(--bg-line);border-radius:20px;font-size:15px}
.hint{font-size:13px;color:var(--on-bg-muted);margin:6px 2px 0}
.link{color:var(--on-bg);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:15px;padding:8px 2px}

/* ---------- Тиждень ---------- */
.day-block{background:var(--surface);color:var(--ink);border-radius:22px;padding:12px 12px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.day-block.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.day-h b{font-family:var(--font-round);font-size:17px}
.day-h .d{color:var(--muted);font-size:14px;font-weight:600}
.day-h .sp{flex:1}
.day-h .plus-s{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:600;display:grid;place-items:center}
.day-block .row{box-shadow:none;background:color-mix(in srgb,var(--cc) 12%,var(--surface2));min-height:54px}
.day-block .row.done{background:var(--surface2)}

.day-block .none{font-size:14px;color:var(--muted);padding:2px 2px 2px}

.quick{display:flex;gap:8px;margin:8px 0}
.quick input{flex:1;min-width:0;border:none;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;font-size:16px}
.quick button{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:0 16px;font-weight:700;font-size:15px}

/* ---------- Календар ---------- */
.cal{background:var(--surface);color:var(--ink);border-radius:22px;padding:10px 8px 8px;margin-top:14px;box-shadow:var(--shadow)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0 6px}
.cal-d{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-size:16px;font-weight:600}
.cal-d.out{color:var(--muted);opacity:.45}
.cal-d.today .n{color:var(--accent);font-weight:800}
.cal-d.sel{background:var(--accent)} .cal-d.sel .n{color:var(--accent-ink)}
.cal-d .dots{display:flex;gap:3px;height:6px}
.cal-d .dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots .bd,.legend .lg-bd{background:var(--p-mid)} .dots .ev,.legend .lg-ev{background:var(--accent)} .dots .tk,.legend .lg-tk{background:var(--muted)}
.cal-d.sel .dots i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin:10px 0 0;font-weight:600}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:block}

/* ---------- Плани ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 4px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 14px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
details.fold{margin-top:18px}
details.fold summary{color:var(--on-bg-muted);font-weight:700;font-size:14px;padding:6px 2px;list-style:none}
details.fold summary::before{content:"▸ "}
details.fold[open] summary::before{content:"▾ "}

/* ---------- Ще ---------- */
.card{background:var(--surface);color:var(--ink);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 4px}
.card p{color:var(--muted);font-size:14px;margin:0 0 12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Нижні вікна ---------- */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(12,10,24,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--font-round);font-size:22px;margin:0 0 16px}
.fld{display:block;margin-bottom:16px}
.fld>span,.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font-size:16px;min-height:46px;-webkit-appearance:none;appearance:none}
.fld textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-radius:999px;padding:9px 13px;background:var(--surface2);font-size:14.5px;font-weight:600;min-height:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg.full button{border-radius:10px;background:none}
.seg.full button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border-radius:14px;padding:14px;font-weight:700;font-size:16px;min-height:50px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{flex:none;color:var(--miss);padding:14px 8px}
.btn.small{flex:none;min-height:42px;padding:10px 14px;font-size:15px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface2);border-radius:14px;padding:14px;font-size:16.5px;font-weight:600;min-height:56px}
.menu button .e{font-size:22px;width:28px;text-align:center}
.menu button small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.hist{border-top:1px solid var(--line);margin:4px 0 16px;padding-top:12px}
.hist ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.hist li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:none}
.this-day{background:var(--surface2);border-radius:14px;padding:12px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:15px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;z-index:40;max-width:90%;text-align:center}

/* ---------- Логотип ---------- */
.brand{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-family:var(--font-round);font-weight:700;font-size:15px;color:var(--on-bg)}
.logo{width:32px;height:32px;border-radius:9px;flex:none;display:block;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.logo svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Сигнали й статистика ---------- */
.signal{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--cc,var(--accent)) 14%,var(--surface));color:var(--ink);border-radius:18px;padding:12px 14px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.signal .e{font-size:18px;line-height:1.2}
.signals{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi b{font-family:var(--font-round);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-weight:700;font-size:15px}
.kpi .delta{margin-left:auto;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--surface2)}
.kpi .delta.up{color:var(--done)} .kpi .delta.down{color:var(--miss)}
.days-chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:16px;align-items:end}
.dc{display:flex;flex-direction:column;align-items:center;gap:5px}
.dc .col{width:100%;max-width:32px;height:78px;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.dc .col i{display:block;background:var(--done)}
.dc .col i.no{background:var(--miss);opacity:.75}
.dc small{font-size:12px;font-weight:800;color:var(--muted)}
.dc small.today{color:var(--accent)}
.dc em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.best{margin:12px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.habit{--cc:var(--c-other);display:block;width:100%;text-align:left;background:color-mix(in srgb,var(--cc) 11%,var(--surface));color:var(--ink);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.habit .top{display:flex;align-items:center;gap:8px}
.habit .top .t{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.habit .top .n{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cells span{height:24px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--muted)}
.cells span.off{background:transparent;border:1.5px dashed var(--line)}
.cells span.ok{background:var(--done);color:#fff}
.cells span.no{background:var(--miss);color:#fff}
.cells span.sk{background:var(--surface2);color:var(--skip)}
.chal{margin-top:10px;font-size:13px;font-weight:700;color:var(--muted)}
.chal .track{height:8px;border-radius:8px;background:var(--surface);overflow:hidden;margin-top:5px}
.chal .track i{display:block;height:100%;border-radius:8px;background:var(--cc)}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--accent);white-space:nowrap}
.badge.warn{color:var(--miss)}

.cnt-v{min-width:34px;text-align:center;font-family:var(--font-round);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.cells span.cnt-c{background:var(--accent-soft);color:var(--ink)}
.since{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px}
.row.up{padding-left:14px}
.row .cd{font-family:var(--font-round);font-weight:700;font-size:20px;color:var(--cc);flex:none;min-width:52px;text-align:right;line-height:1;padding-right:6px}
.row .cd small{display:block;font-family:var(--font);font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}

/* ---------- Вибір кольорів ---------- */
.pals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal{border:2px solid transparent;border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}

.pal b{font-size:14px;font-weight:800}
@media (prefers-reduced-motion:reduce){body{transition:none}}
.sheet .hint,.card .hint{color:var(--muted)}

          toast("\u041D\u0430\u043F\u0438\u0448\u0438 \u043D\u0430\u0437\u0432\u0443 \u0441\u043F\u0440\u0430\u0432\u0438");
          return;
        }
        f.note = q("#f-note").value.trim();
        if (when === "day") {
          f.date = q("#f-date").value || today();
          f.time = q("#f-time").value;
          f.weekOf = null;
          const type = q("#f-rep").value;
          const prevUntil = f.repeat.until;
          f.repeat = { type };
          if (prevUntil && type !== "none") f.repeat.until = prevUntil;
          if (type === "days") {
            if (!days.length) {
              toast("\u041E\u0431\u0435\u0440\u0438 \u0445\u043E\u0447\u0430 \u0431 \u043E\u0434\u0438\u043D \u0434\u0435\u043D\u044C \u0442\u0438\u0436\u043D\u044F");
              return;
            }
            f.repeat.days = days.slice().sort();
          }
          if (type === "interval") {
            const n = parseInt(q("#f-n").value, 10);
            if (!(n >= 2 && n <= 365)) {
              toast("\u0412\u043A\u0430\u0436\u0438 \u043A\u0456\u043B\u044C\u043A\u0456\u0441\u0442\u044C \u0434\u043D\u0456\u0432 \u0432\u0456\u0434 2 \u0434\u043E 365");
              return;
            }
            f.repeat.n = n;
          }
          if (type === "none" || !f.goal) {
            delete f.goal;
            delete f.cycle;
          }
        } else {
          f.date = null;
          f.time = "";
          f.repeat = { type: "none" };
          delete f.goal;
          f.weekOf = when === "week" ? week : null;
        }
        await safe(saveTask(f));
        closeSheet();
        toast(isNew ? "\u0414\u043E\u0434\u0430\u043D\u043E" : "\u0417\u0431\u0435\u0440\u0435\u0436\u0435\u043D\u043E");
      };
      if (q("#f-del")) q("#f-del").onclick = async () => {
        const msg = isRepeating(task) ? `\u0412\u0438\u0434\u0430\u043B\u0438\u0442\u0438 \xAB${task.title}\xBB \u0440\u0430\u0437\u043E\u043C \u0437 \u0443\u0441\u0456\u0454\u044E \u0456\u0441\u0442\u043E\u0440\u0456\u0454\u044E \u0432\u0438\u043A\u043E\u043D\u0430\u043D\u043D\u044F?` : `\u0412\u0438\u0434\u0430\u043B\u0438\u0442\u0438 \xAB${task.title}\xBB?`;
        if (!confirm(msg)) return;
        await safe(removeTask(task.id));
        closeSheet();
        toast("\u0412\u0438\u0434\u0430\u043B\u0435\u043D\u043E");
      };
    });
  }

      toast("\u0426\u0435\u0439 \u0444\u0430\u0439\u043B \u043D\u0435 \u0441\u0445\u043E\u0436\u0438\u0439 \u043D\u0430 \u0440\u0435\u0437\u0435\u0440\u0432\u043D\u0443 \u043A\u043E\u043F\u0456\u044E \u043F\u043B\u0430\u043D\u0435\u0440\u0430");
    }
  });
})();
